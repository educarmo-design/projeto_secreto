# Supabase Local Development Config
# This config file is used by `supabase start` to set up your local development environment.

[api]
# Port to use for the API server. Default: 54321
port = 54321
# Schemas to expose in your API. Excludes realtime, storage, and auth schemas.
schemas = ["public", "storage", "graphql_public"]
# Extra schemas to expose in your API.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database server. Default: 54322
port = 54322
# The database major version to use. This has to be the same as your remote database's. Run `SHOW server_version;` on your remote database to check.
major_version = 15

[studio]
# Port to use for Supabase Studio. Default: 54323
port = 54323

[local_smtp]
# Port to use for the email testing server. Default: 54324
port = 54324

[storage]
# The maximum file size allowed (in bytes). Default: 52428800 (50MB)
file_size_limit = 52428800

[auth]
# The maximum number of seconds a session can last before requiring a refresh. Default: 3600 (1 hour)
jwt_expiry = 3600
# If the jwt_expiry_jti claim included in the token.
enable_refresh_token_rotation = true

[realtime]

[analytics]
enabled = false

[functions.garmin-gateway]
# true é o padrão da plataforma, mas deixado explícito de propósito: a
# runtime do Supabase já recusa requisições sem um JWT válido antes mesmo
# de garmin-gateway/index.ts rodar. Isso cobre só AUTENTICAÇÃO (é um
# usuário Supabase válido?) — a AUTORIZAÇÃO ("esse usuário é um
# profissional dono desta prescrição?") continua sendo responsabilidade do
# próprio index.ts, que revalida o JWT via `auth.getUser()` e confere o
# vínculo em `planejamento_clinico`.
verify_jwt = true

[functions.extract-metric-photo]
# F10 (Pipeline Gemini / Zero Storage). Mesmo raciocínio de garmin-gateway
# acima: cobre só autenticação de plataforma. A função revalida o JWT via
# `auth.getUser()` (defesa em profundidade) e NÃO usa service_role — não
# toca em nenhuma tabela, só lê a foto da RAM, chama o Gemini e a destrói.
verify_jwt = true

[functions.calculate-recovery-mode]
# Mesmo raciocínio de garmin-gateway acima: cobre só autenticação de
# plataforma. Etapa 1 — cálculo real da Esteira dos 14 Dias Free, lendo/
# escrevendo em `esteira_trial_estado` via service role.
verify_jwt = true
