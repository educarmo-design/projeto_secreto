name: atleta_gamificacao
description: "Aplicativo Atleta com Gamificação - ONDA 2 (Clean Architecture + Supabase)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase Integration
  supabase_flutter: ^2.0.0
  supabase: ^2.0.0

  # Secure Storage
  flutter_secure_storage: ^10.2.0

  # Hardware-backed biometric gate (FaceID / Android BiometricPrompt) used to
  # release the Supabase session token from Keystore/Keychain storage.
  local_auth: ^2.3.0

  # Routing
  go_router: ^12.0.0

  # State Management
  flutter_riverpod: ^2.5.0

  # i18n & Localization
  intl: ^0.20.2

  # HTTP Client
  http: ^1.1.0

  # Utilities
  uuid: ^4.0.0
  equatable: ^2.0.5
  health: ^13.3.2
  camera: ^0.12.0+1

  # RELATÓRIO 20260928_0002 — resolve o warning "apply Kotlin Gradle Plugin
  # (KGP)" nos 4 pacotes citados (workmanager_android/device_info_plus/
  # file_picker/health). Cadeia de bloqueio até chegar aqui: os 3 primeiros
  # convergem em exigir win32 ^6.x, incompatível com o
  # flutter_secure_storage ^9.0.0 antigo (resolvido subindo-o pra 10.2.0+,
  # ver acima) — e, junto disso, health >=13.3.2 (única faixa que libera
  # device_info_plus 13.x) exige json_annotation ^4.12.0, incompatível com
  # `freezed ^2.4.0` (via a cadeia `build`). `freezed`/`freezed_annotation`/
  # `json_serializable`/`build_runner` nunca tiveram uso real no código
  # (zero `@freezed`/`@JsonSerializable`/arquivo `.g.dart`/`.freezed.dart`
  # em todo o repo, confirmado por busca) — removidos como dependências
  # mortas em vez de forçar um bump de `freezed` pra 3.x (que seria maior e
  # arriscado por nada, já que nada os usa). Ver o relatório de dev-log.
  workmanager: ^0.10.10
  connectivity_plus: ^6.0.0
  file_picker: ^13.1.0
  device_info_plus: ^13.2.0
  record: ^7.1.1
  path_provider: ^2.1.6

  # Charts (RELATÓRIO 20260927_0001 — Gráfico de Histórico de Peso; nenhuma
  # biblioteca de gráficos existia no Flutter antes desta tarefa, ao
  # contrário do Painel Web, que já usa `recharts`; `fl_chart` é a opção
  # citada explicitamente na RESTRIÇÃO da tarefa).
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  mocktail: ^1.0.5

  # Dublê de PlatformFile (file_picker 13.x) em
  # test/features/gamification/.../missoes_exames_page_test.dart —
  # já era dependência transitiva (via file_picker_platform_interface),
  # declarada aqui explicitamente por exigência do lint
  # `depend_on_referenced_packages`.
  cross_file: ^0.3.5+4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/i18n/
