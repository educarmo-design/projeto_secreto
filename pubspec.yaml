name: atleta_gamificacao
description: "Aplicativo Atleta com Gamificação - ONDA 2 (Clean Architecture + Supabase)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase Integration
  supabase_flutter: ^2.0.0
  supabase: ^2.0.0

  # Secure Storage
  flutter_secure_storage: ^10.2.0

  # Hardware-backed biometric gate (FaceID / Android BiometricPrompt) used to
  # release the Supabase session token from Keystore/Keychain storage.
  local_auth: ^2.3.0

  # Routing
  go_router: ^12.0.0

  # State Management
  flutter_riverpod: ^2.5.0

  # i18n & Localization
  intl: ^0.20.2

  # HTTP Client
  http: ^1.1.0

  # Utilities
  uuid: ^4.0.0
  equatable: ^2.0.5

  # RELATÓRIO 20260928_0003 — health 13.3.2 REVERTIDO pra 13.3.1: build real
  # (assembleDebug) quebrou com erros de compilação Kotlin genuínos dentro
  # do próprio código-fonte do plugin (`Unresolved reference 'HealthConstants'`
  # e afins em HealthDataWriter.kt/HealthPlugin.kt, mais "Argument type
  # mismatch: MatchGroup vs Int" — não é aviso, é erro fatal de
  # `:health:compileDebugKotlin`). Não é algo que `flutter analyze`/`flutter
  # test` (rodados no RELATÓRIO 20260928_0002) conseguem detectar — nenhum
  # dos dois invoca o compilador Kotlin/Gradle real; só um build nativo pega
  # isso, e este ambiente não tem um. Nenhuma versão mais nova do `health`
  # existe ainda pra corrigir isso. Como device_info_plus 13.x/file_picker
  # 13.x só foram liberados por causa do health >=13.3.2 (ver histórico no
  # 20260928_0002), os 3 voltaram junto — sem isso, health 13.3.1 exige
  # device_info_plus ^12.1.0 de novo, e device_info_plus <13.1.0 não é
  # compatível com o win32 ^6.x que file_picker >=13.0.0 exige.
  # flutter_secure_storage 10.2.0+/workmanager 0.10.10/remoção de
  # freezed-morto continuam de pé, não têm relação com este bug.
  health: ^13.3.1
  camera: ^0.12.0+1
  workmanager: ^0.10.10
  connectivity_plus: ^6.0.0
  file_picker: ^11.0.2
  device_info_plus: ^12.4.0
  record: ^7.1.1
  path_provider: ^2.1.6

  # Charts (RELATÓRIO 20260927_0001 — Gráfico de Histórico de Peso; nenhuma
  # biblioteca de gráficos existia no Flutter antes desta tarefa, ao
  # contrário do Painel Web, que já usa `recharts`; `fl_chart` é a opção
  # citada explicitamente na RESTRIÇÃO da tarefa).
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/i18n/
