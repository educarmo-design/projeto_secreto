org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# PERMANECE false, de propósito (testado e revertido — ver commit): ligar
# esta flag faz o AGP 9 recusar QUALQUER subprojeto que ainda aplique o
# Kotlin Gradle Plugin antigo por conta própria — e app_links, device_info_plus,
# health e workmanager_android fazem exatamente isso incondicionalmente. Com
# a flag ligada, o build quebra em app_links com "the 'org.jetbrains.kotlin.
# android' plugin is no longer required... since AGP 9.0" antes mesmo de
# chegar no file_picker. A correção do file_picker (que É AGP9-aware e
# esperava essa flag ligada) foi feita à parte, aplicando o Kotlin só para
# aquele subprojeto específico — ver android/build.gradle.kts e o RELATÓRIO
# DE FIM DE TAREFA / dívida técnica (migração para Built-in Kotlin).
android.builtInKotlin=false
